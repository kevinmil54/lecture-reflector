name: LectureReflector
options:
  bundleIdPrefix: com.kevinmiller
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
targets:
  LectureReflector:
    type: application
    platform: macOS
    sources:
      - path: LectureReflector/Sources
      - path: LectureReflector/Resources
    dependencies:
      - package: WhisperKit
    entitlements:
      path: LectureReflector/LectureReflector.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinmiller.lecture_reflector
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: Lecture Reflector shows and records you with the camera as part of the lecture video.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Lecture Reflector records your voice for the lecture video and its transcript.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Timely Snow LLC. All rights reserved."
        INFOPLIST_KEY_CFBundleExecutable: Lecture Reflector
        INFOPLIST_KEY_CFBundleName: Lecture Reflector
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: YCTW9YH58J
